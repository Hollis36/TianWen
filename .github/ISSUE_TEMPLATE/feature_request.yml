name: Feature request
description: Suggest an improvement to the framework, CLI or docs
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that TianWen makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
